---
system:
  apt:
    lock_timeout: 300

container_runtime:
  name: containerd
  version: "2.2.2"
  package_version: "2.2.2-0ubuntu1.1"

kubernetes:
  version: "1.36.4"
  package_version: "1.36.4-1.1"
  repository_url: "https://pkgs.k8s.io/core:/stable"

  cluster:
    pod_network_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"

  readiness:
    timeout: 1800
    retry_interval: 10
    warning_after: 300

helm:
  version: "4.3.0"
  repository_url: "https://get.helm.sh"

cni:
  name: cilium
  version: "1.20.2"
  repository_url: "https://helm.cilium.io/"
  kube_proxy_replacement: false

  ipam:
    mode: cluster-pool

longhorn:
  version: "1.13.0"
  repository_url: "https://charts.longhorn.io"

  ingress:
    enabled: true
    class_name: traefik
    host: longhorn.dev.homelab
    tls:
      enabled: true
      secret_name: longhorn-tls
      cluster_issuer: homelab-ca

metallb:
  version: "0.16.1"
  repository_url: "https://metallb.github.io/metallb"

  address_pool:
    name: dev-pool
    addresses:
      - "192.168.56.200-192.168.56.220"

  l2_advertisement:
    interfaces:
      - enp0s8

traefik:
  version: "41.6.1"
  repository_url: "https://traefik.github.io/charts"

  service:
    type: LoadBalancer

cert_manager:
  version: "v1.21.2"
  repository_url: "https://charts.jetstack.io"

  private_ca:
    enabled: true
    cluster_issuer_name: homelab-ca
    secret_name: homelab-root-ca
    common_name: "Homelab Root CA"
    validity_days: 3650

seaweedfs:
  version: "4.48.0"
  repository_url: "https://seaweedfs.github.io/seaweedfs/helm"
  namespace: seaweedfs

  master:
    enabled: true
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  volume:
    enabled: true
    replicas: 1
    dataDirs:
      - name: data1
        type: persistentVolumeClaim
        size: 10Gi
        storageClass: longhorn
        maxVolumes: 0

  filer:
    enabled: true
    replicas: 1
    defaultReplicaPlacement: "000"
    data:
      type: persistentVolumeClaim
      size: 5Gi
      storageClass: longhorn

  s3:
    enabled: true
    replicas: 1
    enableAuth: true

  ingress:
    enabled: true
    class_name: traefik
    tls:
      enabled: true
      cluster_issuer: homelab-ca

    master:
      host: seaweedfs.dev.homelab
      secret_name: seaweedfs-master-tls

    filer:
      host: filer.dev.homelab
      secret_name: seaweedfs-filer-tls

cloudnative_pg:
  version: "0.29.1"
  repository_url: "https://cloudnative-pg.github.io/charts"
  namespace: cnpg-system

  replicaCount: 1

  crds:
    create: true

  config:
    clusterWide: true

  webhook:
    mutating:
      create: true
    validating:
      create: true

  rbac:
    create: true

  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 256Mi

  monitoring:
    podMonitorEnabled: false

postgresql:
  namespace: databases

  infrastructure:
    name: postgres-infra
    image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
    instances: 1

    storage:
      storage_class: longhorn
      size: 10Gi

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    superuser:
      enabled: true
      secret_name: postgres-infra-superuser

    airflow:
      database: airflow
      username: airflow
      secret_name: postgres-infra-airflow

rabbitmq:
  namespace: messaging

  operators:
    cluster:
      version: "v2.23.1"
      manifest_url: "https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.1/cluster-operator.yml"

    topology:
      version: "v1.20.2"
      manifest_url: "https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.20.2/messaging-topology-operator-with-certmanager.yaml"

  infrastructure:
    name: rabbitmq-infra
    replicas: 1

    storage:
      storage_class: longhorn
      size: 5Gi

    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi

    users:
      admin:
        username: admin
        secret_name: rabbitmq-infra-admin

      airflow:
        username: airflow
        secret_name: rabbitmq-infra-airflow
        vhost: /airflow