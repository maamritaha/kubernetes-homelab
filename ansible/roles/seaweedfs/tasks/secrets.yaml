---
- name: Ensure SeaweedFS namespace exists
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: v1
    kind: Namespace
    name: "{{ seaweedfs.namespace }}"
    state: present

- name: Load SeaweedFS S3 credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/seaweedfs.yaml.vault"
  when:
    - seaweedfs.s3.enabled | bool
    - seaweedfs.s3.enableAuth | bool
  no_log: true

- name: Configure SeaweedFS S3 authentication
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: seaweedfs-s3-config
        namespace: "{{ seaweedfs.namespace }}"
      type: Opaque
      stringData:
        seaweedfs_s3_config: "{{ s3_config | to_json }}"
  vars:
    s3_config:
      identities:
        - name: admin
          credentials:
            - accessKey: "{{ seaweedfs_s3_access_key }}"
              secretKey: "{{ seaweedfs_s3_secret_key }}"
          actions:
            - Admin
            - Read
            - Write
            - List
            - Tagging
  when:
    - seaweedfs.s3.enabled | bool
    - seaweedfs.s3.enableAuth | bool
  no_log: true