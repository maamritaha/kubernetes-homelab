---
- name: Install Kubernetes repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true
  become: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "{{ kubernetes.repository_url }}:/v{{ kubernetes.version.split('.')[0:2] | join('.') }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-release.key
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Convert Kubernetes repository signing key
  ansible.builtin.command:
    cmd: >
      gpg --dearmor
      --yes
      --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /etc/apt/keyrings/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true

- name: Configure Kubernetes APT repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - "{{ kubernetes.repository_url }}:/v{{ kubernetes.version.split('.')[0:2] | join('.') }}/deb/"
    suites:
      - "/"
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present
  become: true

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes.package_version }}"
      - "kubeadm={{ kubernetes.package_version }}"
      - "kubectl={{ kubernetes.package_version }}"
    state: present
  become: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true
  when: not ansible_check_mode

- name: Configure kubelet node IP
  ansible.builtin.lineinfile:
    path: /etc/default/kubelet
    regexp: '^KUBELET_EXTRA_ARGS='
    line: 'KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}'
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart kubelet
