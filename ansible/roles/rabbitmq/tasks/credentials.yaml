---
- name: Load RabbitMQ credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/rabbitmq.yaml.vault"
  no_log: true

- name: Create RabbitMQ admin credentials Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ rabbitmq.infrastructure.users.admin.secret_name }}"
        namespace: "{{ rabbitmq.namespace }}"
        labels:
          rabbitmq.com/topology-operator: "true"
      type: Opaque
      stringData:
        username: "{{ rabbitmq.infrastructure.users.admin.username }}"
        password: "{{ rabbitmq_admin_password }}"
  no_log: true

- name: Create RabbitMQ Airflow credentials Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ rabbitmq.infrastructure.users.airflow.secret_name }}"
        namespace: "{{ rabbitmq.namespace }}"
        labels:
          rabbitmq.com/topology-operator: "true"
      type: Opaque
      stringData:
        username: "{{ rabbitmq.infrastructure.users.airflow.username }}"
        password: "{{ rabbitmq_airflow_password }}"
  no_log: true