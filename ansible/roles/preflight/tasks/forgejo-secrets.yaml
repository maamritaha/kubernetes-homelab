---
- name: Check Forgejo Vault file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/forgejo.yaml.vault"
  register: forgejo_vault_file

- name: Generate Forgejo admin password
  ansible.builtin.set_fact:
    generated_forgejo_admin_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          '/dev/null',
          length=48,
          chars=['ascii_letters', 'digits']
        )
      }}
  when: not forgejo_vault_file.stat.exists
  no_log: true

- name: Encrypt Forgejo admin password
  ansible.builtin.command:
    argv:
      - ansible-vault
      - encrypt_string
      - --vault-password-file
      - "{{ vault_password_file_path }}"
      - --stdin-name
      - forgejo_admin_password
    stdin: "{{ generated_forgejo_admin_password }}"
    stdin_add_newline: false
  register: encrypted_forgejo_admin_password
  changed_when: false
  when: not forgejo_vault_file.stat.exists
  no_log: true

- name: Save encrypted Forgejo admin password
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/forgejo.yaml.vault"
    content: "{{ encrypted_forgejo_admin_password.stdout }}\n"
    mode: "0600"
    force: false
  when: not forgejo_vault_file.stat.exists
  no_log: true

- name: Load Forgejo credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/forgejo.yaml.vault"
  no_log: true

- name: Validate Forgejo admin password
  ansible.builtin.assert:
    that:
      - forgejo_admin_password is defined
      - forgejo_admin_password | length > 0
    fail_msg: "Forgejo admin password is missing"
    quiet: true
  no_log: true