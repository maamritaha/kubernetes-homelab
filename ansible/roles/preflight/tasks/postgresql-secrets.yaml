---
- name: Ensure PostgreSQL secrets directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets"
    state: directory
    mode: "0700"

- name: Check PostgreSQL Vault file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
  register: postgresql_vault_file

- name: Initialize PostgreSQL Vault file
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
    content: "---\n"
    mode: "0600"
    force: false
  when: not postgresql_vault_file.stat.exists

- name: Load PostgreSQL credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
  no_log: true

- name: Validate PostgreSQL application definitions
  ansible.builtin.assert:
    that:
      - >-
        postgresql.infrastructure.databases
        | map(attribute='name') | unique | list | length
        == postgresql.infrastructure.databases | length
      - >-
        postgresql.infrastructure.databases
        | map(attribute='database') | unique | list | length
        == postgresql.infrastructure.databases | length
      - >-
        postgresql.infrastructure.databases
        | map(attribute='username') | unique | list | length
        == postgresql.infrastructure.databases | length
      - >-
        postgresql.infrastructure.databases
        | map(attribute='password_variable') | unique | list | length
        == postgresql.infrastructure.databases | length
    fail_msg: "Duplicate PostgreSQL application definitions detected"

- name: Ensure PostgreSQL superuser password exists
  ansible.builtin.include_tasks: postgresql-application-secret.yaml
  vars:
    credential_name: postgresql_superuser_password
  when: postgresql_superuser_password is not defined

- name: Ensure PostgreSQL application passwords exist
  ansible.builtin.include_tasks: postgresql-application-secret.yaml
  vars:
    credential_name: "{{ item.password_variable }}"
  loop: "{{ postgresql.infrastructure.databases }}"
  loop_control:
    label: "{{ item.name }}"
  when: lookup('ansible.builtin.vars', item.password_variable, default=none) is none