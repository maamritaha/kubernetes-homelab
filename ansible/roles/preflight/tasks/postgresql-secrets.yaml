---
- name: Ensure local PostgreSQL secrets directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets"
    state: directory
    mode: "0700"

- name: Check whether encrypted PostgreSQL credentials exist
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
  register: postgresql_credentials_file

- name: Generate and encrypt PostgreSQL credentials
  when: not postgresql_credentials_file.stat.exists
  block:
    - name: Generate PostgreSQL passwords
      ansible.builtin.set_fact:
        generated_postgresql_superuser_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=48, chars=['ascii_letters', 'digits']) }}
        generated_postgresql_airflow_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=48, chars=['ascii_letters', 'digits']) }}
      no_log: true

    - name: Encrypt PostgreSQL superuser password
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ vault_password_file_path }}"
          - --stdin-name
          - postgresql_superuser_password
        stdin: "{{ generated_postgresql_superuser_password }}"
        stdin_add_newline: false
      register: encrypted_postgresql_superuser_password
      changed_when: false
      no_log: true

    - name: Encrypt Airflow PostgreSQL password
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ vault_password_file_path }}"
          - --stdin-name
          - postgresql_airflow_password
        stdin: "{{ generated_postgresql_airflow_password }}"
        stdin_add_newline: false
      register: encrypted_postgresql_airflow_password
      changed_when: false
      no_log: true

    - name: Save encrypted PostgreSQL credentials
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
        content: |
          ---
          {{ encrypted_postgresql_superuser_password.stdout }}
          {{ encrypted_postgresql_airflow_password.stdout }}
        mode: "0600"
      no_log: true

- name: Load encrypted PostgreSQL credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
  no_log: true