---
- name: Prepare SeaweedFS secrets
  ansible.builtin.import_tasks: seaweedfs-secrets.yaml
  when:
    - seaweedfs.s3.enabled
    - seaweedfs.s3.enableAuth

- name: Prepare PostgreSQL secrets
  ansible.builtin.import_tasks: postgresql-secrets.yaml

- name: Prepare RabbitMQ secrets
  ansible.builtin.import_tasks: rabbitmq-secrets.yaml
  when: rabbitmq is defined

- name: Prepare Forgejo secrets
  ansible.builtin.import_tasks: forgejo-secrets.yaml
  when: forgejo is defined