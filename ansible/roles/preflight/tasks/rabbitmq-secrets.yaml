---
- name: Ensure local RabbitMQ secrets directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets"
    state: directory
    mode: "0700"

- name: Check whether encrypted RabbitMQ credentials exist
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/rabbitmq.yaml.vault"
  register: rabbitmq_credentials_file

- name: Generate and encrypt RabbitMQ credentials
  when: not rabbitmq_credentials_file.stat.exists
  block:
    - name: Generate RabbitMQ passwords
      ansible.builtin.set_fact:
        generated_rabbitmq_admin_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=48, chars=['ascii_letters', 'digits']) }}
        generated_rabbitmq_airflow_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=48, chars=['ascii_letters', 'digits']) }}
      no_log: true

    - name: Encrypt RabbitMQ admin password
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ vault_password_file_path }}"
          - --stdin-name
          - rabbitmq_admin_password
        stdin: "{{ generated_rabbitmq_admin_password }}"
        stdin_add_newline: false
      register: encrypted_rabbitmq_admin_password
      changed_when: false
      no_log: true

    - name: Encrypt RabbitMQ Airflow password
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ vault_password_file_path }}"
          - --stdin-name
          - rabbitmq_airflow_password
        stdin: "{{ generated_rabbitmq_airflow_password }}"
        stdin_add_newline: false
      register: encrypted_rabbitmq_airflow_password
      changed_when: false
      no_log: true

    - name: Save encrypted RabbitMQ credentials
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/rabbitmq.yaml.vault"
        content: |
          ---
          {{ encrypted_rabbitmq_admin_password.stdout }}
          {{ encrypted_rabbitmq_airflow_password.stdout }}
        mode: "0600"
      no_log: true

- name: Load encrypted RabbitMQ credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/rabbitmq.yaml.vault"
  no_log: true