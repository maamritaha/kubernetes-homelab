---
- name: Generate PostgreSQL credential
  ansible.builtin.set_fact:
    generated_postgresql_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          '/dev/null',
          length=48,
          chars=['ascii_letters', 'digits']
        )
      }}
  no_log: true

- name: Encrypt PostgreSQL credential
  ansible.builtin.command:
    argv:
      - ansible-vault
      - encrypt_string
      - --vault-password-file
      - "{{ vault_password_file_path }}"
      - --stdin-name
      - "{{ credential_name }}"
    stdin: "{{ generated_postgresql_password }}"
    stdin_add_newline: false
  register: encrypted_postgresql_password
  changed_when: false
  no_log: true

- name: Append encrypted PostgreSQL credential
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
    line: "{{ encrypted_postgresql_password.stdout }}"
    insertafter: EOF
    state: present
  no_log: true

- name: Reload PostgreSQL credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/postgresql.yaml.vault"
  no_log: true