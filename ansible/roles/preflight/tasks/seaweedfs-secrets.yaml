---
- name: Ensure local SeaweedFS secrets directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets"
    state: directory
    mode: "0700"

- name: Check whether encrypted SeaweedFS credentials exist
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/seaweedfs.yaml.vault"
  register: seaweedfs_credentials_file

- name: Generate and encrypt SeaweedFS credentials
  when: not seaweedfs_credentials_file.stat.exists
  block:
    - name: Generate S3 credentials
      ansible.builtin.set_fact:
        generated_s3_access_key: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=20, chars=['ascii_letters', 'digits']) }}
        generated_s3_secret_key: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=48, chars=['ascii_letters', 'digits']) }}
      no_log: true

    - name: Encrypt S3 access key
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ vault_password_file_path }}"
          - --stdin-name
          - seaweedfs_s3_access_key
        stdin: "{{ generated_s3_access_key }}"
        stdin_add_newline: false
      register: encrypted_s3_access_key
      changed_when: false
      no_log: true

    - name: Encrypt S3 secret key
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ vault_password_file_path }}"
          - --stdin-name
          - seaweedfs_s3_secret_key
        stdin: "{{ generated_s3_secret_key }}"
        stdin_add_newline: false
      register: encrypted_s3_secret_key
      changed_when: false
      no_log: true

    - name: Save encrypted SeaweedFS credentials
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/seaweedfs.yaml.vault"
        content: |
          ---
          {{ encrypted_s3_access_key.stdout }}
          {{ encrypted_s3_secret_key.stdout }}
        mode: "0600"
      no_log: true

- name: Load encrypted SeaweedFS credentials
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../environments/{{ cluster_environment }}/secrets/seaweedfs.yaml.vault"
  no_log: true