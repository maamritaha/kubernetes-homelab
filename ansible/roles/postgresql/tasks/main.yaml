---
- name: Load PostgreSQL credentials
  ansible.builtin.import_tasks: credentials.yaml

- name: Validate PostgreSQL application credentials
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item.password_variable, default='') | length > 0
    fail_msg: "Missing PostgreSQL credential for {{ item.name }}"
    quiet: true
  loop: "{{ postgresql.infrastructure.databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create PostgreSQL namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ postgresql.namespace }}"

- name: Create PostgreSQL superuser Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ postgresql.infrastructure.superuser.secret_name }}"
        namespace: "{{ postgresql.namespace }}"
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      stringData:
        username: postgres
        password: "{{ postgresql_superuser_password }}"
  when: postgresql.infrastructure.superuser.enabled | bool
  no_log: true

- name: Create application PostgreSQL Secrets
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.secret_name }}"
        namespace: "{{ postgresql.namespace }}"
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ item.username }}"
        password: "{{ lookup('ansible.builtin.vars', item.password_variable) }}"
  loop: "{{ postgresql.infrastructure.databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Deploy PostgreSQL infrastructure cluster
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition: "{{ lookup('template', 'cluster.yaml.j2') | from_yaml }}"

- name: Create application PostgreSQL roles
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      metadata:
        name: "{{ postgresql.infrastructure.name }}-{{ item.name }}"
        namespace: "{{ postgresql.namespace }}"
      spec:
        cluster:
          name: "{{ postgresql.infrastructure.name }}"
        name: "{{ item.username }}"
        ensure: present
        login: true
        inherit: true
        superuser: false
        createdb: false
        createrole: false
        connectionLimit: -1
        databaseRoleReclaimPolicy: retain
        passwordSecret:
          name: "{{ item.secret_name }}"
  loop: "{{ postgresql.infrastructure.databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create application PostgreSQL databases
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata:
        name: "{{ postgresql.infrastructure.name }}-{{ item.name }}"
        namespace: "{{ postgresql.namespace }}"
      spec:
        cluster:
          name: "{{ postgresql.infrastructure.name }}"
        name: "{{ item.database }}"
        owner: "{{ item.username }}"
        databaseReclaimPolicy: retain
  loop: "{{ postgresql.infrastructure.databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for PostgreSQL cluster to be ready
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ postgresql.infrastructure.name }}"
    namespace: "{{ postgresql.namespace }}"
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 600
    wait_sleep: 5
  register: postgresql_cluster_status

- name: Wait for application PostgreSQL resources to be applied
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: "{{ item.0 }}"
    name: "{{ postgresql.infrastructure.name }}-{{ item.1.name }}"
    namespace: "{{ postgresql.namespace }}"
    kubeconfig: /etc/kubernetes/admin.conf
  register: postgresql_application_resources
  until: >-
    postgresql_application_resources.resources | length > 0
    and
    (
      postgresql_application_resources.resources[0].status.applied
      | default(false)
      | bool
    )
  retries: 60
  delay: 5
  loop: >-
    {{
      ['DatabaseRole', 'Database']
      | product(postgresql.infrastructure.databases)
      | list
    }}
  loop_control:
    label: "{{ item.0 }}/{{ item.1.name }}"